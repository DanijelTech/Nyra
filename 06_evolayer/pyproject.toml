[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evo-layer"
version = "1.0.0"
description = "EvoLayer (Hermes-Evo): sandboxed, Hermes-gated evolutionary layer for the Nyra robot stack"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
# Real simulator adapters. The core loop and the safety gates run without these.
mujoco = ["mujoco>=3.1", "onnxruntime>=1.17", "numpy>=1.24"]
llm = ["httpx>=0.27"]
dev = ["pytest>=8"]

[project.scripts]
evolayer = "evo_layer.cli:main"

[tool.setuptools]
packages = ["evo_layer", "evo_layer.observer", "evo_layer.critic", "evo_layer.proposer",
            "evo_layer.safety", "evo_layer.simulator", "evo_layer.hermes_interface",
            "evo_layer.versioning", "evo_layer.deploy", "evo_layer.orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:evo_layer.*"]
